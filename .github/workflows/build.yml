name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    uses: ./.github/workflows/packages.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: agent-headunit
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          test "$TAG" = "v$(node -p "require('./provider/package.json').version")"
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            gh release upload "$TAG" dist/agent-headunit-*.tgz --clobber
            if [[ "$draft" == true ]]; then
              gh release edit "$TAG" --draft=false
            fi
          else
            gh release create "$TAG" dist/agent-headunit-*.tgz --verify-tag --title "$TAG" --notes "Install the provider alongside agent-device. See the Windows quick start in the README."
          fi
