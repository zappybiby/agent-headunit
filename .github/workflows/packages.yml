name: Windows packages
on:
  workflow_call:
    inputs:
      agent-device:
        description: agent-device version to check in place of the tested version
        type: string
        default: ''

permissions:
  contents: read

jobs:
  packages:
    runs-on: windows-latest
    outputs:
      python-versions: ${{ steps.stock.outputs.python-versions }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install stock agent-device
        id: stock
        env:
          CANDIDATE: ${{ inputs.agent-device }}
        run: |
          $manifest = Get-Content provider/package.json -Raw | ConvertFrom-Json
          "python-versions=$(ConvertTo-Json -Compress -InputObject $manifest.windowsPython)" >> $env:GITHUB_OUTPUT
          $version = $manifest.devDependencies.'agent-device'
          if ($env:CANDIDATE) { $version = $env:CANDIDATE }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid agent-device version.' }
          npm install --global "agent-device@$version"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((agent-device --version) -ne $version) { throw "Expected agent-device $version." }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Test provider
        run: node --test "tests/*.test.mjs"
      - name: Build provider
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" "emulator"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B scripts/install_provider.py --pack dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $files = tar -tf (Get-ChildItem dist/*.tgz -File).FullName
          if ($LASTEXITCODE -or ($files -match '(^|/)(node_modules|agent-device)(/|$)|\.tgz$')) { throw 'Unexpected dependency in the provider archive.' }
      - name: Install the provider from an Android project
        env:
          STOCK_VERSION: ${{ steps.stock.outputs.version }}
        run: |
          $archive = (Get-ChildItem dist/*.tgz -File).FullName
          $cli = (Get-Command agent-device.cmd).Source
          npm install --global $archive
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-Command agent-device.cmd).Source -ne $cli) { throw 'The agent-device command changed.' }
          if ((agent-device --version) -ne $env:STOCK_VERSION) { throw 'The agent-device version changed.' }
          $env:AGENT_DEVICE_HOME = "$env:RUNNER_TEMP/headunit-home"
          $env:AGENT_DEVICE_STATE_DIR = "$env:RUNNER_TEMP/headunit-state"
          $env:AGENT_DEVICE_SESSION = 'ci'
          $env:ANDROID_AVD_HOME = "$env:RUNNER_TEMP/headunit-avds"
          foreach ($name in 'Pixel_Developer', 'Car_Tablet') {
            $avd = New-Item -ItemType Directory -Path "$env:ANDROID_AVD_HOME/$name.avd" -Force
            "path=$($avd.FullName)" | Set-Content "$env:ANDROID_AVD_HOME/$name.ini"
            'abi.type=x86_64' | Set-Content "$avd/config.ini"
          }
          $modules = (npm root --global)
          node --input-type=module -e "import {loadUpstreamRuntime} from './provider/upstream-runtime.mjs'; await loadUpstreamRuntime(process.argv[1]);" "$modules/agent-device"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Set-Location (New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/android-project")
          agent-headunit setup --data-dir "$env:RUNNER_TEMP/headunit-data" --phone-avd Pixel_Developer --receiver-avd Car_Tablet
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          agent-headunit setup --data-dir "$env:RUNNER_TEMP/headunit-data"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          agent-device connect headunit --platform android
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          agent-device disconnect
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          agent-device daemon stop
      - uses: actions/upload-artifact@v7
        with:
          name: agent-headunit
          path: dist/agent-headunit-*.tgz
          if-no-files-found: error

  runtime:
    needs: packages
    runs-on: windows-latest
    strategy:
      matrix:
        python: ${{ fromJSON(needs.packages.outputs.python-versions) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: agent-headunit
          path: dist
      - name: Test the packaged runtime
        run: |
          tar -xf (Get-ChildItem dist/*.tgz -File).FullName -C dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install -r dist/package/backend/requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version = (Get-Content dist/package/windows/assets.json -Raw | ConvertFrom-Json).fridaVersion
          python -c "import sys, frida; from PIL import Image; from importlib.resources import files; assert frida.__version__ == sys.argv[1]; assert files('frida_tools').joinpath('bridges', 'java.js').is_file()" $version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B -m unittest discover
